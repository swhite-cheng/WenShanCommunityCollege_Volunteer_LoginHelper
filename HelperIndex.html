<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北市文山社大 志工數位小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background-color: white;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
            background-color: #f0f0f0;
        }

        /* 第一項功能：隱藏 input，透過 label 觸發 */
        #camera-input {
            display: none;
        }

        .camera-label {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .map-btn {
            background-color: #ebf5fb;
            border-left: 5px solid #3498db;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>北市文山社大<br>志工數位小幫手</h1>

    <div class="btn-list">
        <!-- 1. 開啟手機相機 -->
        <label for="camera-input" class="btn camera-label">
            📷 1. 開啟手機相機
        </label>
        <input type="file" id="camera-input" accept="image/*" capture="environment">

        <!-- 2. 志工簽到/簽退 撇步 -->
        <a href="https://swhite-cheng.github.io/WenShanCommunityCollege_Volunteer_LoginHelper/" class="btn" target="_blank">
            📝 2. 志工簽到/簽退 撇步
        </a>

        <!-- 3. 志工簽到/簽退 ai -->
        <a href="https://gemini.google.com/share/24d9b7579cae" class="btn" target="_blank">
            🤖 3. 志工簽到/簽退 AI 助手
        </a>

        <!-- 4. 景美國中 校園平面圖 -->
        <a href="https://swhite-cheng.github.io/WenShanCommunityCollege_Volunteer_LoginHelper/JingMeiJuniorHighSchool_Map.png" class="btn map-btn" target="_blank">
            🗺️ 4. 景美國中 校園平面圖
        </a>

        <!-- 5. 木柵國中 校園平面圖 -->
        <a href="https://swhite-cheng.github.io/WenShanCommunityCollege_Volunteer_LoginHelper/MuZhaJuniorHighSchool_Map.png" class="btn map-btn" target="_blank">
            🗺️ 5. 木柵國中 校園平面圖
        </a>
    </div>

    <div class="footer">
        © 北市文山社區大學 志工小白
    </div>
</div>

</body>
</html>
